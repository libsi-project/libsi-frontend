<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <!-- `interactive-widget=resizes-content` lets Chrome/Edge/Samsung
       Browser shrink the layout viewport when the on-screen keyboard
       opens, so position:fixed panels (like the mobile scoreboard) sit
       above the keyboard instead of being covered by it. Safari falls
       back to its default behaviour, which is already keyboard-aware. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <base href="/" />
  <title>sidb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Rubik:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/main.css" />
</head>

<body>
  <script defer src="/main.client.dart.js"></script>
</body>

</html>
